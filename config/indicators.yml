# Indicator catalogue — the single source of truth for how each indicator is
# labelled, grouped and measured on the dashboard.
#
# The pipeline matches rows of ProjectData.xlsx on the two-digit code at the
# start of the "Indicator" column (e.g. "06. Number of local development
# committees" -> "06"). A code that is not listed here stops the build, so a
# new indicator must be added below before it can be published.
#
#   outcome : one of the ids under `outcomes`
#   unit    : ha | count | km   (values with different units are never summed)

outcomes:
  # Listed in chart-colour order: slot 1 blue, 2 orange, 3 aqua, 4 yellow,
  # 5 magenta, 6 green (a colour-blind-safe sequence — keep the order).
  - id: land-management
    name: Land management
    name_fr: Aménagement du territoire
  - id: energy
    name: Energy
    name_fr: Énergie
  - id: forestry
    name: Forestry
    name_fr: Foresterie
  - id: agriculture
    name: Agriculture
    name_fr: Agriculture
  - id: infrastructure
    name: Infrastructure
    name_fr: Infrastructures
  - id: conservation
    name: Conservation
    name_fr: Conservation

indicators:
  "01": { name: Subsistence agriculture, name_fr: Agriculture vivrière, outcome: agriculture, unit: ha }
  "02": { name: Perennial crop plantations, name_fr: Cultures pérennes, outcome: agriculture, unit: ha }
  "03": { name: Agroforestry & wood-energy plantations, name_fr: Agroforesterie et bois-énergie, outcome: energy, unit: ha }
  "04": { name: Savannah set aside for regeneration, name_fr: Savanes mises en défens, outcome: forestry, unit: ha }
  "05": { name: Clean cooking solutions, name_fr: Foyers améliorés, outcome: energy, unit: count }
  "06": { name: Local development committees, name_fr: Comités locaux de développement, outcome: land-management, unit: count }
  "07": { name: Local land-use plans, name_fr: Plans locaux d'aménagement, outcome: land-management, unit: count }
  "08": { name: Land covered by land-use plans, name_fr: Superficie couverte par des plans, outcome: land-management, unit: ha }
  "09": { name: Community forest concessions, name_fr: Concessions forestières communautaires, outcome: forestry, unit: ha }
  "10": { name: Buildings constructed or rehabilitated, name_fr: Bâtiments construits ou réhabilités, outcome: infrastructure, unit: count }
  "11": { name: Roads rehabilitated and maintained, name_fr: Routes réhabilitées et entretenues, outcome: infrastructure, unit: km }
  "12": { name: Bridges and culverts built, name_fr: Ponts et dalots construits, outcome: infrastructure, unit: count }
  "13": { name: Forest conservation, name_fr: Conservation forestière, outcome: conservation, unit: ha }
  "14": { name: Protected plantations, name_fr: Plantations protégées, outcome: agriculture, unit: ha }

# Country names as written in the "Pays" column -> ISO 3166-1 numeric code
# (used to draw the map). "Regional" programmes have no single country.
countries:
  DRC: { iso: "180", name: DR Congo, name_fr: RD Congo }
  Cameroon: { iso: "120", name: Cameroon, name_fr: Cameroun }
  Congo: { iso: "178", name: Republic of Congo, name_fr: République du Congo }
  Gabon: { iso: "266", name: Gabon, name_fr: Gabon }
  Central African Republic: { iso: "140", name: Central African Republic, name_fr: République centrafricaine }
  Equatorial Guinea: { iso: "226", name: Equatorial Guinea, name_fr: Guinée équatoriale }
  Regional: { iso: null, name: Regional, name_fr: Régional }
