<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Results of CAFI-funded programmes across Central Africa: land use, forestry, agriculture, energy, infrastructure and climate impact." />
    <meta name="theme-color" content="#0e3b43" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>CAFI Metrics Hub</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("cafi-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
